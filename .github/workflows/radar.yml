name: 事件雷達（每 6 小時）

on:
  schedule:
    - cron: "17 22,4,10,16 * * *"   # UTC 22/4/10/16 點 ＝ 台灣 06:17、12:17、18:17、00:17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit        # 與其他自動更新排隊，不會同時推送
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 掃描新聞標題，更新候選清單
        run: python scripts/radar_events.py
      - name: 存回變更
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add data/radar_events.json
          if git diff --cached --quiet; then
            echo "沒有變更"
          else
            git commit -m "自動更新事件雷達"
            git pull --rebase origin main
            git push
          fi
