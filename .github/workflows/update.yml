name: 更新行事曆資料

on:
  schedule:
    - cron: "0 23 * * *"   # UTC 23:00 = 台灣時間每天早上 07:00
    - cron: "0 11 * * *"   # UTC 11:00 = 台灣時間每天晚上 19:00（抓當天收盤後的處置公告）
  workflow_dispatch:        # 允許你在 Actions 頁面手動按一下就執行

permissions:
  contents: write           # 允許機器人把更新後的資料存回儲存庫

concurrency:
  group: data-commit        # 與「抓取相關新聞」排隊，不會同時推送
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 更新資料（Yahoo 法說會 + 股東會 + 證交所／櫃買處置股 + 聯準會行事曆）
        run: python scripts/update.py

      - name: 計算各類事件的歷史股價波動（本週重點排序用；失敗不影響其他資料）
        run: python scripts/impact.py || echo "::warning::impact.py 執行失敗，沿用上次結果"

      - name: 存回變更
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "沒有變更"
          else
            git commit -m "自動更新行事曆資料"
            git pull --rebase origin main
            git push
          fi
